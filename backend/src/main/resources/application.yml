spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:badara;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
storage:
  mode: ${STORAGE_MODE:local}
  local-root: ${STORAGE_LOCAL_ROOT:./data-storage}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:badara-files}
jwt:
  secret: ${JWT_SECRET:change-this-secret-key-change-this-secret-key}
  access-token-minutes: 120
server:
  port: ${PORT:8080}
